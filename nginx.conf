server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://places.googleapis.com; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    # Public static files only; never log bearer/body credentials or email links.
    access_log off;

    location /api/ {
        # Docker embedded DNS supports backend container replacement without stale IPs.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://backend:8080;
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_next_upstream off;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://places.googleapis.com; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }
}
